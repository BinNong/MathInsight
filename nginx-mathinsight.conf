# MathInsight Nginx 配置
# 将下面四个 location 块复制到 HTTPS server 块内部（不能放在 http 层）
# 域名: nongbin.site，访问路径: https://nongbin.site/mathinsight

# 无斜杠时重定向
location = /mathinsight {
    return 301 /mathinsight/;
}

# MathInsight 前端静态文件
location /mathinsight/ {
    alias /var/www/mathinsight/;
    try_files $uri $uri/index.html /mathinsight/index.html;
}

# MathInsight API（转发到 Flask 容器）
location /mathinsight/api/ {
    proxy_pass http://127.0.0.1:5001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# MathInsight 文件下载
location /mathinsight/downloads/ {
    proxy_pass http://127.0.0.1:5001/downloads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
